<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCN Agenda — Events de Barcelona</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #000;
    font-size: 16px;
    line-height: 1.4;
  }

  /* ── HEADER ─────────────────────────────────────────────────────────── */
  header {
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 100;
    border-bottom: 1px solid #000;
    padding: 14px 40px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .site-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    white-space: nowrap;
    margin-right: 4px;
  }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }

  .filter-btn {
    background: none;
    border: 1px solid #ccc;
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    color: #000;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: #000; }
  .filter-btn.active { background: #000; color: #fff; border-color: #000; }

  .header-right {
    font-size: 12px;
    color: #999;
    white-space: nowrap;
  }

  /* ── BODY LAYOUT ─────────────────────────────────────────────────────── */
  .body-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 53px);
  }

  /* ── SIDEBAR ─────────────────────────────────────────────────────────── */
  .sidebar {
    border-right: 1px solid #ddd;
    padding: 32px 24px;
    position: sticky;
    top: 53px;
    height: calc(100vh - 53px);
    overflow-y: auto;
  }

  /* Month navigation */
  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .cal-nav h2 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .cal-nav button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: #000;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: background 0.1s;
  }

  .cal-nav button:hover { background: #f0f0f0; }

  /* Calendar grid */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    margin-bottom: 28px;
  }

  .cal-header-cell {
    text-align: center;
    font-size: 10px;
    font-weight: 500;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 0 8px;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.1s;
    gap: 2px;
    position: relative;
  }

  .cal-day:hover { background: #f0f0f0; }
  .cal-day.other-month { color: #ccc; cursor: default; }
  .cal-day.other-month:hover { background: none; }
  .cal-day.today { font-weight: 700; }
  .cal-day.today .cal-day-num { background: #000; color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .cal-day.selected .cal-day-num { background: #000; color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .cal-day.today.selected .cal-day-num { background: #555; }

  .cal-day-num { font-size: 12px; line-height: 1; }

  .cal-dots { display: flex; gap: 2px; height: 4px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: #000; }

  /* Sidebar sections */
  .sidebar-section {
    border-top: 1px solid #eee;
    padding-top: 20px;
    margin-top: 4px;
  }

  .sidebar-section h3 {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #999;
    margin-bottom: 12px;
  }

  .venue-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    cursor: pointer;
    font-size: 13px;
    transition: opacity 0.15s;
  }

  .venue-row:hover { opacity: 0.6; }

  .venue-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #000;
  }

  .venue-name { flex: 1; color: #000; }
  .venue-count { font-size: 12px; color: #999; }

  /* ── MAIN CONTENT ────────────────────────────────────────────────────── */
  main {
    padding: 0 48px 80px;
    min-width: 0;
  }

  /* ── MONTH HEADING ───────────────────────────────────────────────────── */
  .month-heading {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -3px;
    line-height: 1;
    padding: 40px 0 0;
    margin-bottom: 0;
  }

  /* ── EVENT ROW ───────────────────────────────────────────────────────── */
  .event-row {
    display: grid;
    grid-template-columns: 80px 280px 1fr;
    gap: 28px;
    padding: 24px 0;
    border-top: 1px solid #e0e0e0;
    align-items: start;
    cursor: pointer;
    transition: background 0.1s;
  }

  .event-row:hover { background: #fafafa; margin: 0 -48px; padding: 24px 48px; }

  /* Day column */
  .day-col { padding-top: 2px; }
  .day-col.empty { visibility: hidden; }

  .day-num {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -3px;
    display: block;
  }

  .day-name {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
    display: block;
  }

  /* Image */
  .event-img-wrap {
    width: 100%;
    aspect-ratio: 3/2;
    overflow: hidden;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .event-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .event-img-placeholder { font-size: 44px; }

  /* Text */
  .event-text { padding-top: 2px; min-width: 0; }

  .event-meta {
    font-size: 13px;
    margin-bottom: 6px;
  }

  .event-category { font-weight: 700; }
  .event-source { color: #555; }

  .event-title {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.3px;
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .event-desc {
    font-size: 13px;
    color: #555;
    line-height: 1.55;
    margin-bottom: 10px;
  }

  .event-details {
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .event-time { font-weight: 500; }
  .event-venue { color: #888; }
  .event-price { font-weight: 600; color: #2a7a4a; margin-top: 4px; }
  .event-price.paid { color: #000; font-weight: 400; }

  /* Empty state */
  .empty-state {
    padding: 60px 0;
    color: #999;
  }

  .empty-state h3 { font-size: 18px; margin-bottom: 6px; color: #000; }

  /* ── MODAL ───────────────────────────────────────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    max-width: 600px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
  }

  .modal-img {
    width: 100%;
    aspect-ratio: 16/9;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    overflow: hidden;
  }

  .modal-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: rgba(255,255,255,0.92);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-body { padding: 28px 32px 32px; }
  .modal-meta { font-size: 13px; margin-bottom: 10px; }
  .modal-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 16px; line-height: 1.1; }

  .modal-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 18px;
    background: #f8f8f8;
    margin-bottom: 18px;
  }

  .modal-info-item label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #999;
    display: block;
    margin-bottom: 2px;
  }

  .modal-info-item span { font-size: 14px; }

  .modal-desc { font-size: 14px; line-height: 1.65; color: #333; margin-bottom: 22px; }

  .modal-actions { display: flex; gap: 10px; }

  .btn-primary {
    background: #000;
    color: #fff;
    border: none;
    padding: 11px 22px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
  }

  .btn-primary:hover { background: #333; }

  .btn-secondary {
    background: none;
    border: 1px solid #ccc;
    padding: 11px 18px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-secondary:hover { border-color: #000; }

  /* ── RESPONSIVE ──────────────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .body-layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    header { padding: 12px 20px; }
    main { padding: 0 20px 60px; }
    .month-heading { font-size: 44px; }
    .event-row { grid-template-columns: 56px 180px 1fr; gap: 16px; }
    .event-row:hover { margin: 0; padding: 24px 0; }
    .day-num { font-size: 40px; }
    .event-title { font-size: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="site-title">BCN Agenda</div>
  <nav class="filters">
    <button class="filter-btn active" onclick="filterEvents('all', this)">Tot</button>
    <button class="filter-btn" onclick="filterEvents('music', this)">Música</button>
    <button class="filter-btn" onclick="filterEvents('art', this)">Art</button>
    <button class="filter-btn" onclick="filterEvents('culture', this)">Cultura</button>
    <button class="filter-btn" onclick="filterEvents('food', this)">Food</button>
    <button class="filter-btn" onclick="filterEvents('family', this)">Família</button>
    <button class="filter-btn" onclick="filterEvents('free', this)">Gratuït</button>
  </nav>
  <div class="header-right" id="update-badge"></div>
</header>

<div class="body-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="cal-nav">
      <button onclick="prevMonth()">‹</button>
      <h2 id="cal-title"></h2>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <div class="sidebar-section">
      <h3>Espais</h3>
      <div id="venue-list"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main-content"></main>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let EVENTS = [];
let activeFilter = 'all';
let selectedDate = null;
let calDate = new Date();

const DAYS_CA   = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];
const MONTHS_CA = ['Gener','Febrer','Març','Abril','Maig','Juny','Juliol','Agost','Setembre','Octubre','Novembre','Desembre'];
const CAL_HEADERS = ['Dl','Dm','Dc','Dj','Dv','Ds','Dg'];

const CATEGORY_LABELS = { music:'Música', art:'Art', culture:'Cultura', food:'Food', family:'Família' };
const EVENT_EMOJI     = { music:'🎵', art:'🎨', culture:'🏛', food:'🍜', family:'👨‍👩‍👧' };

const VENUE_COLORS = [
  '#D4451A','#2B5F8E','#6B8C3A','#8B5E3C','#7B3F8C','#1A7A4A','#5A8A2A','#B06030','#3A6080',
];

// ─── LOAD ─────────────────────────────────────────────────────────────────────
async function loadEvents() {
  try {
    const r = await fetch('data/bcn_agenda.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    EVENTS = (data.events || []).filter(e => e.date);
    if (data.generated_at) {
      const diffH = Math.round((Date.now() - new Date(data.generated_at)) / 3600000);
      document.getElementById('update-badge').textContent = `Actualitzat fa ${diffH}h`;
    }
  } catch(e) {
    console.warn('No data:', e.message);
    EVENTS = [];
  }
  renderCalendar();
  renderVenues();
  renderEvents();
}

// ─── FILTER ───────────────────────────────────────────────────────────────────
function filterEvents(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEvents();
}

function getFiltered() {
  let ev = [...EVENTS];
  if (selectedDate) ev = ev.filter(e => e.date === selectedDate);
  if (activeFilter === 'free') return ev.filter(e => e.free);
  if (activeFilter !== 'all') return ev.filter(e => e.type === activeFilter || (e.tags||[]).includes(activeFilter));
  return ev;
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  const year  = calDate.getFullYear();
  const month = calDate.getMonth();
  document.getElementById('cal-title').textContent = `${MONTHS_CA[month]} ${year}`;

  const firstDay   = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = (firstDay + 6) % 7; // Mon=0
  const today = new Date();

  let html = CAL_HEADERS.map(d => `<div class="cal-header-cell">${d}</div>`).join('');

  // Prev month fill
  const prevDays = new Date(year, month, 0).getDate();
  for (let i = 0; i < startOffset; i++) {
    html += `<div class="cal-day other-month"><span class="cal-day-num">${prevDays - startOffset + i + 1}</span></div>`;
  }

  // Event dates index
  const eventDates = {};
  EVENTS.forEach(e => {
    if (!eventDates[e.date]) eventDates[e.date] = [];
    eventDates[e.date].push(e.type);
  });

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday    = today.getDate()===d && today.getMonth()===month && today.getFullYear()===year;
    const isSelected = selectedDate === dateStr;
    const types      = eventDates[dateStr] || [];

    const dots = types.length
      ? `<div class="cal-dots">${[...new Set(types)].slice(0,3).map(() => `<div class="cal-dot"></div>`).join('')}</div>`
      : '';

    const cls = ['cal-day', isToday?'today':'', isSelected?'selected':''].filter(Boolean).join(' ');
    html += `<div class="${cls}" onclick="selectDate('${dateStr}')">
               <span class="cal-day-num">${d}</span>${dots}
             </div>`;
  }

  // Next month fill
  const totalCells = startOffset + daysInMonth;
  const remaining  = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day other-month"><span class="cal-day-num">${i}</span></div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;
}

function prevMonth() { calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); }
function nextMonth() { calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); }

function selectDate(dateStr) {
  selectedDate = selectedDate === dateStr ? null : dateStr;
  renderCalendar();
  renderEvents();
}

// ─── VENUES ───────────────────────────────────────────────────────────────────
function renderVenues() {
  const counts = {};
  EVENTS.forEach(e => { counts[e.venue] = (counts[e.venue]||0) + 1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 8);

  document.getElementById('venue-list').innerHTML = sorted.map(([v, c], i) => `
    <div class="venue-row">
      <div class="venue-dot" style="background:${VENUE_COLORS[i % VENUE_COLORS.length]}"></div>
      <span class="venue-name">${escHtml(v)}</span>
      <span class="venue-count">${c}</span>
    </div>`).join('');
}

// ─── RENDER EVENTS ────────────────────────────────────────────────────────────
function renderEvents() {
  const events = getFiltered();
  const main   = document.getElementById('main-content');

  if (!events.length) {
    main.innerHTML = `<div class="empty-state"><h3>Cap event trobat</h3><p>Prova un altre filtre o data</p></div>`;
    return;
  }

  let html = '';
  let lastMonth = null;
  let lastDate  = null;

  for (const e of events) {
    const d        = new Date(e.date + 'T00:00:00');
    const monthKey = `${d.getFullYear()}-${d.getMonth()}`;

    if (monthKey !== lastMonth) {
      html += `<h2 class="month-heading">${MONTHS_CA[d.getMonth()]} ${d.getFullYear()}</h2>`;
      lastMonth = monthKey;
      lastDate  = null;
    }

    const showDay = e.date !== lastDate;
    const dayCol  = showDay
      ? `<div class="day-col">
           <span class="day-num">${d.getDate()}</span>
           <span class="day-name">${DAYS_CA[d.getDay()].toLowerCase()}</span>
         </div>`
      : `<div class="day-col empty"></div>`;
    lastDate = e.date;

    const imgCol = e.image
      ? `<div class="event-img-wrap"><img class="event-img" src="${escHtml(e.image)}" alt="" loading="lazy"
           onerror="this.parentElement.innerHTML='<div class=event-img-placeholder>${EVENT_EMOJI[e.type]||'🗓'}</div>'"></div>`
      : `<div class="event-img-wrap"><div class="event-img-placeholder">${EVENT_EMOJI[e.type]||'🗓'}</div></div>`;

    const catLabel = CATEGORY_LABELS[e.type] || e.type || '';
    const meta     = `<div class="event-meta"><span class="event-category">${escHtml(catLabel)}</span>${e.source ? ` <span class="event-source">${escHtml(e.source)}</span>` : ''}</div>`;

    let details = '';
    if (e.time)         details += `<span class="event-time">${escHtml(e.time)}</span>`;
    if (e.venue)        details += `<span class="event-venue">${escHtml(e.venue)}</span>`;
    if (e.price||e.free) {
      const txt = e.free ? 'Gratuït' : e.price;
      details += `<span class="event-price${e.free?'':' paid'}">${escHtml(txt)}</span>`;
    }

    html += `
      <div class="event-row" onclick="openModal(${e.id})">
        ${dayCol}
        ${imgCol}
        <div class="event-text">
          ${meta}
          <h3 class="event-title">${escHtml(e.title)}</h3>
          ${e.desc ? `<p class="event-desc">${escHtml(e.desc.slice(0,160))}${e.desc.length>160?'…':''}</p>` : ''}
          <div class="event-details">${details}</div>
        </div>
      </div>`;
  }

  main.innerHTML = html;
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openModal(id) {
  const e = EVENTS.find(ev => ev.id === id);
  if (!e) return;

  const d       = new Date(e.date + 'T00:00:00');
  const dateStr = `${DAYS_CA[d.getDay()]}, ${d.getDate()} ${MONTHS_CA[d.getMonth()]}`;
  const catLabel = CATEGORY_LABELS[e.type] || e.type || '';

  const imgHtml = e.image
    ? `<div class="modal-img"><img src="${escHtml(e.image)}" alt=""></div>`
    : `<div class="modal-img">${EVENT_EMOJI[e.type]||'🗓'}</div>`;

  document.getElementById('modal-content').innerHTML = `
    ${imgHtml}
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-body">
      <div class="modal-meta"><strong>${escHtml(catLabel)}</strong>${e.source ? ` · ${escHtml(e.source)}` : ''}</div>
      <h2 class="modal-title">${escHtml(e.title)}</h2>
      <div class="modal-info">
        <div class="modal-info-item"><label>Data</label><span>${dateStr}</span></div>
        <div class="modal-info-item"><label>Hora</label><span>${e.time||'—'}</span></div>
        <div class="modal-info-item"><label>Espai</label><span>${escHtml(e.venue||'—')}</span></div>
        <div class="modal-info-item"><label>Preu</label><span>${e.free?'Gratuït':escHtml(e.price||'—')}</span></div>
      </div>
      ${e.desc ? `<p class="modal-desc">${escHtml(e.desc)}</p>` : ''}
      <div class="modal-actions">
        ${e.url ? `<button class="btn-primary" onclick="window.open('${escHtml(e.url)}','_blank')">Més informació →</button>` : ''}
        <button class="btn-secondary" onclick="closeModal()">Tancar</button>
      </div>
    </div>`;

  document.getElementById('modal').classList.add('open');
}

function closeModal(evt) {
  if (!evt || evt.target === document.getElementById('modal'))
    document.getElementById('modal').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// ─── UTILS ────────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadEvents();
</script>
</body>
</html>
