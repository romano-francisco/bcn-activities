<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCN Agenda — Events de Barcelona</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #000;
    font-size: 16px;
    line-height: 1.4;
  }

  /* ── HEADER ─────────────────────────────────────────────────────────── */
  header {
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 100;
    border-bottom: 1px solid #000;
    padding: 14px 48px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .site-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    white-space: nowrap;
    margin-right: 8px;
  }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }

  .filter-btn {
    background: none;
    border: 1px solid #ccc;
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    color: #000;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: #000; }
  .filter-btn.active { background: #000; color: #fff; border-color: #000; }

  .header-right {
    font-size: 12px;
    color: #999;
    white-space: nowrap;
  }

  /* ── MAIN ────────────────────────────────────────────────────────────── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 48px 80px;
  }

  /* ── MONTH HEADING ───────────────────────────────────────────────────── */
  .month-heading {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -3px;
    line-height: 1;
    padding: 48px 0 0;
    margin-bottom: 0;
  }

  /* ── EVENT ROW ───────────────────────────────────────────────────────── */
  .event-row {
    display: grid;
    grid-template-columns: 90px 300px 1fr;
    gap: 32px;
    padding: 28px 0;
    border-top: 1px solid #ddd;
    align-items: start;
    cursor: pointer;
    transition: background 0.1s;
  }

  .event-row:hover { background: #fafafa; }

  /* ── DAY COLUMN ──────────────────────────────────────────────────────── */
  .day-col { padding-top: 2px; }
  .day-col.empty { visibility: hidden; }

  .day-num {
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -3px;
    display: block;
  }

  .day-name {
    font-size: 13px;
    color: #888;
    margin-top: 2px;
    display: block;
    text-transform: lowercase;
  }

  /* ── IMAGE COLUMN ────────────────────────────────────────────────────── */
  .event-img-wrap {
    width: 100%;
    aspect-ratio: 3/2;
    overflow: hidden;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .event-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .event-img-placeholder {
    font-size: 52px;
  }

  /* ── TEXT COLUMN ─────────────────────────────────────────────────────── */
  .event-text { padding-top: 4px; }

  .event-meta {
    font-size: 13px;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .event-category { font-weight: 700; }
  .event-source { color: #555; }

  .event-title {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .event-desc {
    font-size: 14px;
    color: #444;
    line-height: 1.55;
    margin-bottom: 12px;
    max-width: 520px;
  }

  .event-details {
    font-size: 14px;
    color: #000;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .event-time { font-weight: 500; }

  .event-venue { color: #888; }

  .event-price {
    display: inline-block;
    font-size: 13px;
    margin-top: 6px;
    font-weight: 600;
    color: #2a7a4a;
  }

  .event-price.paid { color: #000; font-weight: 400; }

  /* ── EMPTY STATE ─────────────────────────────────────────────────────── */
  .empty-state {
    padding: 80px 0;
    text-align: center;
    color: #999;
  }

  .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: #000; }

  /* ── MODAL ───────────────────────────────────────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
  }

  .modal-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
  }

  .modal-img img { width: 100%; height: 100%; object-fit: cover; }

  .modal-body { padding: 32px; }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,255,255,0.9);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }

  .modal-meta { font-size: 13px; margin-bottom: 12px; }
  .modal-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 16px; line-height: 1.1; }

  .modal-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 20px;
    background: #f8f8f8;
    margin-bottom: 20px;
  }

  .modal-info-item label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #999;
    display: block;
    margin-bottom: 3px;
  }

  .modal-info-item span { font-size: 14px; }

  .modal-desc { font-size: 14px; line-height: 1.65; color: #333; margin-bottom: 24px; }

  .modal-actions { display: flex; gap: 10px; }

  .btn-primary {
    background: #000;
    color: #fff;
    border: none;
    padding: 12px 24px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
  }

  .btn-primary:hover { background: #333; }

  .btn-secondary {
    background: none;
    border: 1px solid #ccc;
    padding: 12px 20px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-secondary:hover { border-color: #000; }

  /* ── RESPONSIVE ──────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    header { padding: 12px 20px; }
    main { padding: 0 20px 60px; }
    .month-heading { font-size: 48px; }
    .event-row { grid-template-columns: 60px 1fr; grid-template-rows: auto auto; gap: 16px; }
    .event-img-wrap { grid-column: 2; }
    .event-text { grid-column: 1 / -1; }
    .day-num { font-size: 44px; }
    .event-title { font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="site-title">BCN Agenda</div>
  <nav class="filters">
    <button class="filter-btn active" onclick="filterEvents('all', this)">Tot</button>
    <button class="filter-btn" onclick="filterEvents('music', this)">Música</button>
    <button class="filter-btn" onclick="filterEvents('art', this)">Art</button>
    <button class="filter-btn" onclick="filterEvents('culture', this)">Cultura</button>
    <button class="filter-btn" onclick="filterEvents('food', this)">Food</button>
    <button class="filter-btn" onclick="filterEvents('family', this)">Família</button>
    <button class="filter-btn" onclick="filterEvents('free', this)">Gratuït</button>
  </nav>
  <div class="header-right" id="update-badge"></div>
</header>

<main id="main-content"></main>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
let EVENTS = [];
let activeFilter = 'all';

const CATEGORY_LABELS = {
  music: 'Música', art: 'Art', culture: 'Cultura',
  food: 'Food', family: 'Família', free: 'Gratuït',
};

const EVENT_EMOJI = {
  music: '🎵', art: '🎨', culture: '🏛', food: '🍜', family: '👨‍👩‍👧',
};

const DAYS_CA = ['Diumenge','Dilluns','Dimarts','Dimecres','Dijous','Divendres','Dissabte'];
const MONTHS_CA = ['Gener','Febrer','Març','Abril','Maig','Juny','Juliol','Agost','Setembre','Octubre','Novembre','Desembre'];

// ─── LOAD ─────────────────────────────────────────────────────────────────────
async function loadEvents() {
  try {
    const r = await fetch('data/bcn_agenda.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    EVENTS = (data.events || []).filter(e => e.date);
    if (data.generated_at) {
      const diffH = Math.round((Date.now() - new Date(data.generated_at)) / 3600000);
      document.getElementById('update-badge').textContent = `Actualitzat fa ${diffH}h`;
    }
  } catch(e) {
    console.warn('No data found:', e.message);
    EVENTS = [];
  }
  render();
}

// ─── FILTER ───────────────────────────────────────────────────────────────────
function filterEvents(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function getFiltered() {
  let events = [...EVENTS];
  if (activeFilter === 'free') return events.filter(e => e.free);
  if (activeFilter !== 'all') return events.filter(e => e.type === activeFilter || (e.tags || []).includes(activeFilter));
  return events;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const events = getFiltered();
  const main = document.getElementById('main-content');

  if (!events.length) {
    main.innerHTML = `<div class="empty-state"><h3>Cap event trobat</h3><p>Prova un altre filtre</p></div>`;
    return;
  }

  // Group by month, then by day
  let html = '';
  let lastMonth = null;
  let lastDate = null;

  for (const e of events) {
    const d = new Date(e.date + 'T00:00:00');
    const monthKey = `${d.getFullYear()}-${d.getMonth()}`;
    const dateKey = e.date;

    // Month heading
    if (monthKey !== lastMonth) {
      html += `<h2 class="month-heading">${MONTHS_CA[d.getMonth()]} ${d.getFullYear()}</h2>`;
      lastMonth = monthKey;
      lastDate = null; // reset day within new month
    }

    // Day column: only show number on first event of the day
    const showDay = dateKey !== lastDate;
    const dayCol = showDay
      ? `<div class="day-col">
           <span class="day-num">${d.getDate()}</span>
           <span class="day-name">${DAYS_CA[d.getDay()].toLowerCase()}</span>
         </div>`
      : `<div class="day-col empty"><span class="day-num">${d.getDate()}</span></div>`;
    lastDate = dateKey;

    // Image
    const imgCol = e.image
      ? `<div class="event-img-wrap"><img class="event-img" src="${escHtml(e.image)}" alt="${escHtml(e.title)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=event-img-placeholder>${EVENT_EMOJI[e.type]||'🗓'}</div>'"></div>`
      : `<div class="event-img-wrap"><div class="event-img-placeholder">${EVENT_EMOJI[e.type] || '🗓'}</div></div>`;

    // Category + source
    const catLabel = CATEGORY_LABELS[e.type] || e.type || '';
    const meta = `<div class="event-meta"><span class="event-category">${escHtml(catLabel)}</span>${e.source ? ` <span class="event-source">${escHtml(e.source)}</span>` : ''}</div>`;

    // Time + venue + price
    let details = '';
    if (e.time) details += `<span class="event-time">${escHtml(e.time)}</span>`;
    if (e.venue) details += `<span class="event-venue">${escHtml(e.venue)}</span>`;
    if (e.price || e.free) {
      const priceText = e.free ? 'Gratuït' : e.price;
      const priceClass = e.free ? 'event-price' : 'event-price paid';
      details += `<span class="${priceClass}">${escHtml(priceText)}</span>`;
    }

    html += `
      <div class="event-row" onclick="openModal(${e.id})">
        ${dayCol}
        ${imgCol}
        <div class="event-text">
          ${meta}
          <h3 class="event-title">${escHtml(e.title)}</h3>
          ${e.desc ? `<p class="event-desc">${escHtml(e.desc.slice(0, 180))}${e.desc.length > 180 ? '…' : ''}</p>` : ''}
          <div class="event-details">${details}</div>
        </div>
      </div>`;
  }

  main.innerHTML = html;
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openModal(id) {
  const e = EVENTS.find(ev => ev.id === id);
  if (!e) return;

  const d = new Date(e.date + 'T00:00:00');
  const dateStr = `${DAYS_CA[d.getDay()]}, ${d.getDate()} ${MONTHS_CA[d.getMonth()]}`;
  const catLabel = CATEGORY_LABELS[e.type] || e.type || '';

  const imgHtml = e.image
    ? `<div class="modal-img"><img src="${escHtml(e.image)}" alt="${escHtml(e.title)}"></div>`
    : `<div class="modal-img">${EVENT_EMOJI[e.type] || '🗓'}</div>`;

  document.getElementById('modal-content').innerHTML = `
    ${imgHtml}
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-body">
      <div class="modal-meta"><strong>${escHtml(catLabel)}</strong>${e.source ? ` · ${escHtml(e.source)}` : ''}</div>
      <h2 class="modal-title">${escHtml(e.title)}</h2>
      <div class="modal-info">
        <div class="modal-info-item"><label>Data</label><span>${dateStr}</span></div>
        <div class="modal-info-item"><label>Hora</label><span>${e.time || '—'}</span></div>
        <div class="modal-info-item"><label>Espai</label><span>${escHtml(e.venue || '—')}</span></div>
        <div class="modal-info-item"><label>Preu</label><span>${e.free ? 'Gratuït' : escHtml(e.price || '—')}</span></div>
      </div>
      ${e.desc ? `<p class="modal-desc">${escHtml(e.desc)}</p>` : ''}
      <div class="modal-actions">
        ${e.url ? `<button class="btn-primary" onclick="window.open('${escHtml(e.url)}','_blank')">Més informació →</button>` : ''}
        <button class="btn-secondary" onclick="closeModal()">Tancar</button>
      </div>
    </div>`;

  document.getElementById('modal').classList.add('open');
}

function closeModal(evt) {
  if (!evt || evt.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ─── UTILS ────────────────────────────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadEvents();
</script>
</body>
</html>
